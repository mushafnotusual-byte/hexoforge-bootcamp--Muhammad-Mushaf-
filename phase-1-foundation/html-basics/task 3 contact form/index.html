<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Task three: contact form</h1>
    </header>
    <main>
        <form method="post">
            <div>

                <label for="fname">name:</label>
                <input type="text" id="fname" name="fname" placeholder=" enter your name" required />
            </div>
            <br>




            <div>
                <label for="gender"> gender:</label>

                <label>male</label>
                <input type="radio" name="gender" id="male" value="male" />
                <label>female</label>
                <input type="radio" name="gender" id="female" value="female" />
                <label>prefer not to say</label>
                <input type="radio" name="gender" id="prefer_not_to_say" value="prefer_not_to_say" />
            </div>
            <br>



            <div>
                <label for="email">email</label>
                <input type="email" id="email" name="email" placeholder="abcd@gmail.com" required />
            </div>
            <br>
            <div>
                <input type="reset" />
            </div>
            <br>
            <div>
                <input type="submit" />
            </div>
            <br>
            <div>
                <label for="checkbox">subscribe to newsletter</label>
                <input type="checkbox" id="checkbox" name="checkbox" required />
            </div>
            <br>
            <div>

                <label for="payments"> payments:</label>
                <select name="payments" id="payments">
                    <option value="paypal">paypal</option>
                    <option value="credit card">credit card</option>
                    <option value="debit card">debit card</option>
                </select>
            </div>
            <br>
            <div>
                <label for="message">Your Message:</label><br>

                <textarea id="message" name="message" rows="5" cols="40"
                    placeholder="Enter your message here..."></textarea>

            </div>


        </form>


    </main>

</body>

</html>
